<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山河十四卷 · 宋韵水墨武侠单机</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b3a3c'/%3E%3Crect x='5' y='5' width='54' height='54' rx='8' fill='none' stroke='%23cfa85e' stroke-width='2.2'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='33' font-family='KaiTi,STKaiti,serif' font-weight='700' fill='%23f1f5f1'%3E%E5%8D%B7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/main.css?v=1.0.1">
</head>
<body>
<div id="app">

  <!-- ================= 标题屏：左竖排宋韵题字 + 右侧绢帛卷轴存档 ================= -->
  <div id="screen-title" class="screen active">
    <div class="title-shell">
      <section class="title-hero-pane">
        <div class="title-vertical-wrap">
          <div class="title-seal-badge">宋韵<br>孤本</div>
          <h1 class="game-title">山河十四卷</h1>
          <div class="title-vert-sub">金庸群侠水墨单机 · 壹点零版</div>
        </div>
        <div class="title-poem-card">
          <div class="verses">飞雪连天射白鹿　笑书神侠倚碧鸳<br>青绿百间踏江湖　见招拆招定山河</div>
          <div class="title-highlights">
            <span class="tag jade">26 区 · 141 间子房间</span>
            <span class="tag blue">十四天书 · 115 幕立绘剧场</span>
            <span class="tag gold">策略回合 · 藏经百层试炼</span>
          </div>
        </div>
      </section>

      <section class="title-scroll-pane">
        <div class="title-sec">
          <div class="title-sec-hd">
            <h3>展卷入江湖 · 选择存档</h3>
            <button class="btn-sm" onclick="JY.UI.openSaveIoModal()">📤 存档码备份 / 导入</button>
          </div>
          <div class="slots" id="slot-list"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- ================= 创建角色屏 ================= -->
  <div id="screen-create" class="screen">
    <div class="create-head-bar">
      <div>
        <h2>立名号 · 定出身 · 调根骨</h2>
        <div class="create-sub">一纸山河卷，初入江湖的根骨与出身将左右开局奇遇与流派方向</div>
      </div>
      <div style="display:flex;gap:10px;">
        <button onclick="JY.UI.setScreen('title')">返回卷首</button>
        <button class="btn-primary" onclick="JY.UI.enterWorld()">仗剑入山河</button>
      </div>
    </div>
    <div class="create-grid-body">
      <div class="create-card">
        <h3>一、名号与出身</h3>
        <div class="name-line">
          <span>少侠大名：</span>
          <input id="name-input" maxlength="6" placeholder="请输入大名">
        </div>
        <div class="origin-grid" id="origin-grid"></div>
      </div>
      <div class="create-card">
        <h3>二、先天根骨（剩余点数：<b id="pts-left" style="color:var(--accent);">15</b>）</h3>
        <div id="attr-alloc"></div>
      </div>
    </div>
  </div>

  <!-- ================= 游戏主屏：青黛墨绿顶栏 + 左宽幅主舞台 + 右侧挂轴信息栏 ================= -->
  <div id="screen-game" class="screen">
    <header class="topbar">
      <span class="seal">卷</span>
      <div class="hero-pill" id="top-hero"></div>
      <span class="clock-pill" id="top-clock"></span>
      <div class="res-pill" id="top-res"></div>
      <div class="spacer"></div>
      <nav class="top-nav">
        <button class="lockable" onclick="JY.UI.openModal('martial','skills')">武学试炼</button>
        <button class="lockable" onclick="JY.UI.openModal('gear','equipped')">神兵宝甲</button>
        <button class="lockable" onclick="JY.UI.openModal('life','bag')">行囊百艺</button>
        <button class="lockable" onclick="JY.UI.openModal('quest','mainline')">山河卷轴</button>
        <button class="lockable" onclick="JY.UI.openModal('mates')">同道红颜</button>
        <button class="lockable btn-gold" onclick="JY.UI.openModal('world')">大世界舆图</button>
        <button id="top-audio-btn" onclick="JY.Audio.cycleMode()">🔊 音效</button>
        <button onclick="JY.UI.manualSave()">存卷</button>
      </nav>
    </header>

    <div class="game-body">
      <!-- 左侧宽幅沉浸主舞台（探索 / 立绘剧情剧场 / 策略回合战斗 三态互斥） -->
      <main class="stage-col">
        <section class="scene-head">
          <div class="scene-banner">
            <img id="scene-img" src="assets/scene-town.webp" alt="场景画卷">
            <div class="scene-meta">
              <div class="scene-meta-top">
                <div>
                  <div class="scene-region" id="scene-region">悦来镇</div>
                  <div class="scene-room" id="scene-room">镇口牌坊</div>
                </div>
              </div>
              <div class="scene-desc-bar" id="scene-desc"></div>
            </div>
          </div>
          <div class="npc-strip" id="npc-strip"></div>
        </section>

        <!-- 态 1：自由探索 + 主线罗盘条 + 底部悬浮玉简操作坞 -->
        <section id="pane-explore" class="stage-pane active">
          <div class="main-guide-bar" id="main-guide-bar"></div>
          <div class="explore-log" id="explore-log"></div>
          <div class="room-actions-dock" id="room-actions-dock"></div>
        </section>

        <!-- 态 2：沉浸式立绘剧情剧场 -->
        <section id="pane-story" class="stage-pane">
          <div class="theater-wrap">
            <div class="theater-stage">
              <div class="th-actor" id="th-left"><img id="th-left-img" src="assets/hero-portrait.webp" alt="左立绘"></div>
              <div class="th-actor" id="th-right"><img id="th-right-img" src="assets/npc-baixiaosheng.webp" alt="右立绘"></div>
            </div>
            <div class="th-dialog-box">
              <div class="th-speaker-row">
                <span class="th-speaker" id="th-speaker">旁白</span>
                <span class="tag blue" id="th-ep-title"></span>
              </div>
              <div class="th-text" id="th-text"></div>
              <div class="th-choices" id="th-choices"></div>
            </div>
          </div>
        </section>

        <!-- 态 3：策略回合战斗舞台（玉简手牌） -->
        <section id="pane-combat" class="stage-pane">
          <div class="combat-wrap">
            <div class="combat-arena">
              <div class="combat-top-bar">
                <span class="tag jade" id="cb-turn">第 1 回合</span>
                <div style="display:flex;gap:6px;">
                  <button class="btn-sm" id="cb-auto-btn" onclick="JY.Combat.toggleAuto()">▶ 自动策略</button>
                  <button class="btn-sm" id="cb-fast-btn" onclick="JY.Combat.toggleFast()">⚡ 2×倍速：关</button>
                </div>
              </div>
              <div class="combat-fighters" id="cb-fighters"></div>
              <div class="intent-banner" id="cb-intent"></div>
            </div>
            <div class="combat-log" id="cb-log"></div>
            <div class="combat-hand">
              <div class="skill-hand-grid" id="cb-hand"></div>
              <div class="combat-util-row" id="cb-utils"></div>
            </div>
          </div>
        </section>
      </main>

      <!-- 右侧青黛挂轴信息栏：区域子房间青绿舆图 + 侠客玉牌 + 江湖指引 -->
      <aside class="nav-rail">
        <div class="rail-box">
          <div class="rail-hd"><span id="nav-region-name">悦来镇</span><button class="btn-sm lockable" onclick="JY.UI.openModal('world')">全图</button></div>
          <div class="room-map-wrap">
            <svg id="room-map-svg" class="room-map-svg" viewBox="0 0 250 196"></svg>
          </div>
          <div class="room-legend"><span>青=当前</span><span>!=剧情</span><span>⚔=强敌</span><span>夜=黑市</span></div>
        </div>
        <div class="rail-box" id="nav-hero-card"></div>
        <div class="rail-box">
          <div class="rail-hd"><span>山河指引</span></div>
          <div class="quest-pin" id="nav-quest-pin"></div>
        </div>
      </aside>
    </div>
  </div>
</div>

<!-- 统一宽屏宋韵弹窗容器 -->
<div class="modal-mask" id="main-modal-mask">
  <div class="modal-box">
    <div class="modal-hd">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <h3 id="modal-title">卷轴</h3>
        <div class="modal-tabs" id="modal-tabs"></div>
      </div>
      <button class="btn-sm modal-close-btn" onclick="JY.UI.closeModal()">合卷 ✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- 高清立绘画卷鉴赏灯箱 & 全局悬浮轻提示 -->
<div class="lightbox-mask" id="lightbox-mask" onclick="JY.UI.closeLightbox()">
  <img id="lightbox-img" src="" alt="水墨原画鉴赏">
  <div class="lightbox-cap" id="lightbox-cap">点击任意处关闭</div>
</div>
<div class="jy-toast" id="jy-toast"></div>

<!-- ==================== 单一原子脚本包（防弱网/CDN 丢包半加载） ==================== -->
<script src="js/game.bundle.js?v=1.0.1"></script>
<script>
window.addEventListener("DOMContentLoaded", function () {
  var ok = !!(window.JY && JY.UI && JY.World && JY.Story && JY.REGIONS && JY.REGIONS.yuelai);
  if (ok) return;
  var slotBox = document.getElementById("slot-list");
  if (slotBox) {
    slotBox.innerHTML = '<div class="slot-card" style="border-color:#b24035;background:#fff8f5;">' +
      '<div class="slot-flag" style="color:#b24035;">加载中断</div>' +
      '<div style="font-size:15px;font-weight:700;color:#8c2a21;">山河卷核心脚本未能完整下载</div>' +
      '<div style="font-size:12.5px;color:#4a5e5e;line-height:1.7;">检测到当前网络访问 GitHub Pages 时脚本中断，请点击下方按钮重新加载；或前往仓库 Release 下载单文件离线版断网畅玩。</div>' +
      '<div class="slot-acts"><button class="btn-primary btn-sm" onclick="location.reload()">🔄 重新加载页面</button></div>' +
      '</div>';
  }
});
</script>
</body>
</html>
